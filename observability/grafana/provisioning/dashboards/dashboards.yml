# Auto-load dashboards from the mounted ``dashboards/`` directory.
# Drop a new JSON file in there and it shows up in Grafana after a
# reload — no UI clicks required.
apiVersion: 1

providers:
  - name: portal-dashboards
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
