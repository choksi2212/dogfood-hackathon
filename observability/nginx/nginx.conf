# nginx configuration for the DOGFOOD portal.
#
# Public entry point. Routes by prefix:
#   /                  → frontend (Next.js, Mihir's stack)
#   /api               → Django backend
#   /admin             → Django admin
#   /widget.js         → Django embeddable script (public)
#   /api/widget        → Django embeddable JSON feed (public)
#   /grafana           → Grafana dashboards (operator)
#   /prometheus        → Prometheus query UI (operator)
#   /alertmanager      → Alertmanager routing UI (operator)
#
# The operator UIs are intentionally NOT auth-gated here. Bind the
# published port to 127.0.0.1 (see docker-compose.yml) so they're
# only reachable from the laptop.

upstream django_backend {
    server web:8000;
    keepalive 32;
}

upstream next_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream grafana_ui {
    server grafana:3001;
}

upstream prometheus_ui {
    server prometheus:9090;
}

upstream alertmanager_ui {
    server alertmanager:9093;
}

server {
    listen 80;
    server_name _;

    # Larger client body for the submission endpoint (1 MB).
    client_max_body_size 1m;

    # Compression — gzip everything above 256 bytes except already-
    # compressed assets. Cuts API response size ~5x for JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain;

    # nginx-level microcache for the hottest public reads (gallery,
    # widget JSON). Saves a Django hop on repeat scrapes. Disabled
    # by default; toggle via ``MICROCACHE=on|off``.
    location /api/gallery {
        proxy_pass http://django_backend;
        proxy_cache microcache;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Microcache-Status $upstream_cache_status always;
    }
    location /api/widget/gallery {
        proxy_pass http://django_backend;
        proxy_cache microcache;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Microcache-Status $upstream_cache_status always;
    }

    # Django + Next.js both want this on.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Forward the inbound X-Request-ID (set by upstream proxies / load
    # balancers) so the Django correlation middleware can stitch the
    # trace together. If absent, the middleware mints a UUID.
    proxy_set_header X-Request-ID $http_x_request_id;

    # --------------------------------------------------------------
    # Frontend — Next.js handles everything except the API prefix.
    # --------------------------------------------------------------
    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host $host;
        # Long timeout for slow SSR pages; default 60s is too tight.
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------
    # Django backend — every ``/api/*`` route plus the public health
    # probe (called by container healthchecks + load balancers).
    # --------------------------------------------------------------
    location /api/ {
        proxy_pass http://django_backend;
    }
    location /admin/ {
        proxy_pass http://django_backend;
    }
    location = /healthz {
        proxy_pass http://django_backend;
    }
    location = /widget.js {
        proxy_pass http://django_backend;
    }
    location = /metrics {
        # Prometheus scrapes this directly. Bypass the microcache so
        # scrapes always see fresh counters.
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }
    location = /observability/ping {
        proxy_pass http://django_backend;
    }

    # --------------------------------------------------------------
    # Observability UIs (operator-facing, host-bound).
    # --------------------------------------------------------------
    location /grafana/ {
        # Grafana serves its UI at /; rewrite our prefix off.
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://grafana_ui;
        proxy_set_header Host $host;
    }
    location /prometheus/ {
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://prometheus_ui;
        proxy_set_header Host $host;
    }
    location /alertmanager/ {
        rewrite ^/alertmanager/(.*)$ /$1 break;
        proxy_pass http://alertmanager_ui;
        proxy_set_header Host $host;
    }
}

# Microcache backing store: ~50MB shared memory dict, 30s default.
# Keys are URL + Vary; locks prevent thundering-herd on cache misses.
proxy_cache_path /var/cache/nginx/microcache
    levels=1:2 keys_zone=microcache:10m max_size=50m inactive=60s
    use_temp_path=off;
