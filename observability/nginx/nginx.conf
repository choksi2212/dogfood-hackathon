# nginx configuration for the DOGFOOD portal.
#
# Public entry point. Routes by prefix:
#   /                  → frontend (Next.js, Mihir's stack)
#   /api               → Django backend
#   /admin             → Django admin
#   /widget.js         → Django embeddable script (public)
#   /api/widget        → Django embeddable JSON feed (public)
#   /grafana           → Grafana dashboards (operator)
#   /prometheus        → Prometheus query UI (operator)
#   /alertmanager      → Alertmanager routing UI (operator)
#
# The operator UIs are intentionally NOT auth-gated here. Bind the
# published port to 127.0.0.1 (see docker-compose.yml) so they're
# only reachable from the laptop.

upstream django_backend {
    server web:8000;
    keepalive 32;
}

upstream next_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream grafana_ui {
    server grafana:3001;
}

upstream prometheus_ui {
    server prometheus:9090;
}

upstream alertmanager_ui {
    server alertmanager:9093;
}

server {
    listen 80;
    server_name _;

    # Larger client body for the submission endpoint (1 MB).
    client_max_body_size 1m;

    # Django + Next.js both want this on.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Forward the inbound X-Request-ID (set by upstream proxies / load
    # balancers) so the Django correlation middleware can stitch the
    # trace together. If absent, the middleware mints a UUID.
    proxy_set_header X-Request-ID $http_x_request_id;

    # --------------------------------------------------------------
    # Frontend — Next.js handles everything except the API prefix.
    # --------------------------------------------------------------
    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host $host;
        # Long timeout for slow SSR pages; default 60s is too tight.
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------
    # Django backend — every ``/api/*`` route plus the public health
    # probe (called by container healthchecks + load balancers).
    # --------------------------------------------------------------
    location /api/ {
        proxy_pass http://django_backend;
    }
    location /admin/ {
        proxy_pass http://django_backend;
    }
    location = /healthz {
        proxy_pass http://django_backend;
    }

    # --------------------------------------------------------------
    # Observability UIs (operator-facing, host-bound).
    # --------------------------------------------------------------
    location /grafana/ {
        # Grafana serves its UI at /; rewrite our prefix off.
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://grafana_ui;
        proxy_set_header Host $host;
    }
    location /prometheus/ {
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://prometheus_ui;
        proxy_set_header Host $host;
    }
    location /alertmanager/ {
        rewrite ^/alertmanager/(.*)$ /$1 break;
        proxy_pass http://alertmanager_ui;
        proxy_set_header Host $host;
    }
}
