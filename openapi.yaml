openapi: 3.0.3
info:
  title: HACK HAMSTER Hackathon Portal API
  version: 1.0.0
  description: 'Submission and judging portal for the HACK HAMSTER 2026 hackathon. Five
    spec

    routes drive acceptance: gallery, submit, judge_scores, peer_scores,

    csv_export. Public surface for integrators; protected surfaces for

    organizers, judges, and participants via cookie session.

    '
servers:
- url: /
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            detail:
              type: object
    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tagline:
          type: string
        track_slug:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - locked
          - withdrawn
    Certificate:
      type: object
      description: |
        Signed, publicly verifiable record of a submission (project).
        The organizer-only issue response (POST /api/events/{slug}/
        certificates/issue) additionally carries `event`, `project` and
        `verify_url`; the public verify endpoint serves the remaining
        fields only.
      properties:
        public_id:
          type: string
        submission_id:
          type: string
          format: uuid
        event:
          type: string
          description: Event slug — only on the organizer issue response
        project:
          type: string
          description: Project title — only on the organizer issue response
        signed_payload:
          type: object
          description: |
            {kind, event, event_slug, submission_id, project,
            team_name, track} — signed with HMAC-SHA256
        signature:
          type: string
        signature_algorithm:
          type: string
          example: HMAC-SHA256
        issued_at:
          type: string
          format: date-time
        verify_url:
          type: string
          description: Public verify URL for this certificate — only on
            the organizer issue response
    WebhookDelivery:
      type: object
      description: |
        One recorded delivery attempt to a webhook subscriber, as shown in
        the organizer's delivery log (GET /api/webhooks/{webhook_id}/deliveries).
        The exact signed bytes POSTed to the subscriber are reproducible from
        payload_type + payload; `X-Hack-Hamster-Signature` is HMAC-SHA256 over
        those bytes keyed by the subscription secret.
      properties:
        id:
          type: string
          format: uuid
        payload_type:
          type: string
          enum:
          - submission.created
          - score.created
          - vote.created
          - results.published
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        response_status:
          type: integer
          nullable: true
          description: HTTP status the subscriber answered with; null when the
            POST never reached a listener (connection refused, timeout).
        attempts:
          type: integer
          description: Inline attempt plus batch retries; retry is in-place —
            the same row is updated (no duplicates), capped by --max-attempts.
        last_error:
          type: string
          description: Empty string on success; the transport error otherwise.
        created_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
    JudgeRecord:
      type: object
      description: |
        Signed, publicly verifiable record of one judge's participation.
        The signed payload never contains the judge's email — only the
        display name; the organizer-only list/issue responses add
        `judge_email`.
      properties:
        public_id:
          type: string
        event:
          type: string
          description: Event slug
        judge:
          type: string
          description: Display name carried inside the signed payload
        judge_email:
          type: string
          description: Only present on the organizer-authenticated
            list/issue endpoints, never on the public verify endpoint.
        signed_payload:
          type: object
          description: |
            {kind, event, event_slug, judge, assignments,
            scores_submitted, judging_window{open,close}, issued_at}
        signature:
          type: string
        signature_algorithm:
          type: string
          example: HMAC-SHA256
        issued_at:
          type: string
          format: date-time
        verify_url:
          type: string
          description: Public verify URL for this record
    JudgeRecordIssueRequest:
      type: object
      description: |
        Issue one record for a named judge (`{"judge": "<email>"}` —
        must be a member with the judge role) or one record per judge
        holding at least one assignment (`{"all": true}`). Provide
        exactly one of the two keys.
      properties:
        judge:
          type: string
          format: email
        all:
          type: boolean
    EventProgress:
      type: object
      description: |
        Organizer-wide live judging progress. One row per judge plus
        event totals. ``complete`` flips true when every assigned
        project has been reviewed.
      properties:
        event_slug:
          type: string
        judges:
          type: array
          items:
            type: object
            properties:
              judge_email:
                type: string
                format: email
              judge_name:
                type: string
              n_assigned:
                type: integer
              n_reviewed:
                type: integer
              complete:
                type: boolean
        totals:
          type: object
          properties:
            n_judges:
              type: integer
            n_assigned:
              type: integer
            n_reviewed:
              type: integer
            complete:
              type: boolean
    CertificateIssueRequest:
      type: object
      description: |
        Issue one certificate for a named project (`{"project": "<uuid>"}`)
        or one certificate per accepted/submitted project in the event
        (`{"all": true}`). Provide exactly one of the two keys. Issuance
        is idempotent: a submission that already has a certificate keeps
        it, so re-issuing returns the existing row.
      properties:
        project:
          type: string
          format: uuid
        all:
          type: boolean
    FixtureImport:
      type: object
      description: |
        Body shaped like the repo's fixtures.json: `event` (object with
        name + submissions_close), `tracks`/`judges`/`teams`/`projects`
        (lists), optional `scores`. Truncated bodies (missing required
        sections) and bodies over 5 MiB are rejected with 422/413.
        Re-importing the same body is idempotent; the importer is atomic
        (a failed import changes nothing).
      properties:
        event:
          type: object
        tracks:
          type: array
          items:
            type: object
        judges:
          type: array
          items:
            type: object
        teams:
          type: array
          items:
            type: object
        projects:
          type: array
          items:
            type: object
        scores:
          type: array
          items:
            type: object
    ImportResult:
      type: object
      properties:
        imported:
          type: object
          properties:
            projects:
              type: integer
            judges:
              type: integer
            teams:
              type: integer
            scores:
              type: integer
        event:
          type: string
    FixtureExport:
      type: object
      description: |
        The event as fixtures.json-shaped JSON — byte-for-byte
        re-importable by POST /api/events/{slug}/import (and the
        import_fixtures management command). Export -> import -> export
        is byte-identical for importer-seeded events; documented
        caveats (non-standard rubric criteria, synthetic demo
        memberships, duplicate-team resubmits, drafts) live in
        apps/api/exporter.py.
      properties:
        event:
          type: object
        tracks:
          type: array
          items:
            type: object
        judges:
          type: array
          items:
            type: object
        teams:
          type: array
          items:
            type: object
        projects:
          type: array
          items:
            type: object
        scores:
          type: array
          items:
            type: object
paths:
  /healthz:
    get:
      summary: "Liveness probe \xE2\u20AC\u201D DB roundtrip"
      responses:
        '200':
          description: OK
        '503':
          description: Degraded
        '429':
          description: Rate limited
  /metrics:
    get:
      summary: Prometheus metrics exposition (operator-facing)
      description: |
        Counter and histogram metrics for HTTP traffic, request
        latency, and in-flight request count. Authentication is
        intentionally absent \u2014 restrict at the network layer.
      responses:
        '200':
          description: Prometheus text-format metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total ...
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",path="/api/gallery",status="200"} 12.0
  /observability/ping:
    get:
      summary: Cheap liveness probe (no DB roundtrip)
      responses:
        '200':
          description: "pong"
          content:
            text/plain:
              schema:
                type: string
                example: "pong\n"
  /api/schema/:
    get:
      summary: This OpenAPI 3 spec as JSON
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json: {}
        '429':
          description: Rate limited
  /api/gallery:
    get:
      summary: Public gallery of submitted projects
      description: |
        Returns submitted projects with pagination. Two modes:

        * **Cursor (default)** — Response is `{items, next, page_size}`.
          Pass `?after=<cursor>` to fetch the next page. The cursor is
          opaque (base64 of the last item's sort key). Page 1000 is
          just as fast as page 1 because PostgreSQL seeks directly on
          the indexed sort key.

        * **Offset (legacy)** — Pass `?page=N` to opt in. Response is
          `{total, page, page_size, items}`. Slow on late pages.

        Sort modes: `sort=track` (default; by `track__order, name`),
        `sort=alpha` (by name), `sort=newest` (by `-submitted_at`).
        The `?after` cursor must match the current `?sort` mode.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [track, alpha, newest]
        - name: track
          in: query
          schema:
            type: string
          description: Comma-separated track slugs to filter by
        - name: after
          in: query
          schema:
            type: string
          description: Cursor from a previous response's `next` field
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: Opt into offset pagination (legacy)
      responses:
        '200':
          description: List of submissions
          content:
            application/json:
              schema:
                oneOf:
                  - title: Cursor response
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'
                      next:
                        type: string
                        nullable: true
                      page_size:
                        type: integer
                  - title: Offset response (?page=N)
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'
                      total:
                        type: integer
                      page:
                        type: integer
                      page_size:
                        type: integer
        '422':
          description: Malformed cursor or sort/cursor mismatch
        '429':
          description: Rate limited
  /api/submissions/{id}:
    get:
      summary: Single submission detail (public read)
      description: |
        Returns one submission by UUID. Public — anyone with the link can
        read it (matches the gallery's public-read posture). Drafts 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found, withdrawn, or still a draft
        '429':
          description: Rate limited
  /api/register:
    post:
      summary: Create a new user account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: User created; session cookie set
        '400':
          description: Validation failed
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
  /api/login:
    post:
      summary: Authenticate with email + password; sets session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
          application/x-www-form-urlencoded:
            description: >
              Also accepted (issue #19) so standard form posts work:
              curl -d, fetch with URLSearchParams, an HTML form
              fallback. JSON remains the primary format.
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated; session cookie set
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 body must be JSON or form-urlencoded"
  /api/logout:
    post:
      summary: End the current session
      security:
      - cookie: []
      responses:
        '204':
          description: Session ended; cookie cleared
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/me:
    get:
      summary: Current authenticated user profile
      security:
      - cookie: []
      responses:
        '200':
          description: User profile
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
  /api/events/:
    post:
      summary: Create a new event (organizer only)
      security:
      - cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Event created
        '400':
          description: Validation failed
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/:
    get:
      summary: Retrieve full event details (organizer only)
      description: |
        Organizer-only read. Returns the full event payload including
        rubric weights, prize structure, judging window, voting mode,
        and the pairwise toggle. Judges and participants cannot read
        this — they should use `GET /api/events/{slug}/rubric` for the
        rubric they need to score against.
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event detail
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
        '403':
          description: Not an organizer of this event
    put:
      summary: Update an event (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event updated
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
    patch:
      summary: Partial update of an event (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event updated
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/tracks:
    post:
      summary: Add a track to an event (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Track created
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/rubric:
    get:
      summary: Read the rubric for an event (any event member)
      description: |
        Returns the rubric for this event \u2014 criteria names, weights,
        min/max, and order. Visible to any signed-in member of the
        event (judges need it to label sliders, organizers to manage
        it, participants to know what they're being judged on).

        Does NOT include prize structure, judging window, voting mode,
        or the pairwise toggle \u2014 those live on the organizer-only
        `GET /api/events/{slug}/`.
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rubric (empty criteria array if the event has none)
        '404':
          description: Event not found
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
    post:
      summary: Replace the rubric for an event (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Rubric replaced
        '422':
          description: Validation failed (e.g. weights don't sum to 1.0)
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
        '403':
          description: Not an organizer of this event
  /api/events/{slug}/memberships:
    get:
      summary: List memberships for an event (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of memberships
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
  /api/events/{slug}/judges/bulk-invite:
    post:
      summary: Bulk-invite judges by email (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invitations dispatched
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/assignments/run:
    post:
      summary: Run the bipartite assignment algorithm (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Assignment batch metadata
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/me/batch:
    get:
      summary: Judge's assigned projects for the current batch
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Batch contents + progress counts
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
  /api/events/{slug}/me/batch/{project_id}/scores:
    put:
      summary: Save per-criterion scores for an assigned project
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scores saved
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/me/batch/{project_id}/submit:
    post:
      summary: Finalize and submit scores for an assigned project
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scores submitted
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/submit:
    post:
      summary: Submit (or re-submit) a project
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tagline:
                  type: string
                description:
                  type: string
                track_slug:
                  type: string
      responses:
        '201':
          description: Submission created
        '403':
          description: Not a participant of this event
        '422':
          description: Deadline passed or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/normalize:
    post:
      summary: Run the additive alternating-means fit on the event's scores (organizer only)
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Normalization run metadata
        '422':
          description: Bipartite graph disconnected
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
        '403':
          description: Not an organizer of this event
  /api/events/{slug}/pairwise/ballots:
    post:
      summary: Submit a Bradley-Terry ballot
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                left_id:
                  type: string
                  format: uuid
                right_id:
                  type: string
                  format: uuid
                winner:
                  type: string
                  enum:
                  - left
                  - right
                  - tie
      responses:
        '201':
          description: Ballot recorded
        '404':
          description: Event or submission not found
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/events/{slug}/pairwise/ranking:
    get:
      summary: Recovered ranking from all ballots
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Projects ranked by recovered theta
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
  /api/events/{slug}/submissions/{id}/vote:
    post:
      summary: Cast a vote on a submission
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                votes:
                  type: integer
                  default: 1
      responses:
        '201':
          description: Vote recorded
        '403':
          description: Self-vote not allowed
        '404':
          description: Event or submission not found
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
    delete:
      summary: Retract a vote
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retracted
        '404':
          description: No ballot to retract or event/submission not found
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
  /api/events/{slug}/votes/results:
    get:
      summary: Organizer-only tally of live votes per project
      security:
      - cookie: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Per-project vote tally
        '404':
          description: Event not found
        '401':
          description: Unauthenticated
        '403':
          description: Not an organizer of this event
