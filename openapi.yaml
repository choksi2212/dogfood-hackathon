      summary: Bulk-import a fixtures.json-shaped body into the event
        (organizer only)
      description: |
        Reuses the import_fixtures management command via a tempfile,
        so the importer's idempotent + atomic guarantees carry over
        unchanged. If the event does not exist yet, the import
        bootstraps it (any organizer may do so — you cannot hold a
        membership in an event that doesn't exist yet). Bodies larger
        than 5 MiB are rejected with 413; truncated bodies (missing
        required sections) are rejected with 422, never a 500.
      security:
      - cookie: []
      parameters:
