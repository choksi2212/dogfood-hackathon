      description: |
        Streams the event in the exact shape POST /api/events/{slug}/import
        (and import_fixtures) consume. Deterministic ordering and
        fixture-style ids (trk_01, jdg_01, tm_01, prj_01) make
        export -> import -> export byte-identical for importer-seeded
        events; round-trip caveats are documented in apps/api/exporter.py.
      security:
