      responses:
        '200':
          description: Import result (idempotent, so re-import returns 200 too)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '401':
          description: Authentication required
        '403':
          description: Forbidden (organizer role required)
        '413':
          description: Body exceeds the 5 MiB import limit
        '415':
          description: Unsupported media type
        '422':
          description: Validation failed (truncated or malformed fixture body)
        '429':
          description: Rate limited
