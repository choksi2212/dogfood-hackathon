  /api/webhooks:
    get:
      summary: List webhooks (organizer only)
      security:
      - cookie: []
      responses:
        '200':
          description: List of webhook subscriptions
        '429':
          description: Rate limited
        '401':
          description: Unauthenticated
    post:
      summary: Create a webhook (organizer only)
      description: |
        Subscribe `url` to notifications for the event named by `event_slug`.
        The server generates a per-subscription `secret` and returns it ONCE in
        the 201 response — store it immediately; it is never shown again.

        Every delivery is a POST with a JSON envelope `{type, sent_at, data}`
        and three headers: `Content-Type: application/json`, `X-Hack-Hamster-Event`
        (the payload type), and `X-Hack-Hamster-Signature: sha256=<HMAC-SHA256 of
        the exact request body, keyed by the subscription secret>`. Receivers
        MUST verify the signature over the raw received bytes before trusting
        a delivery.

        `events` is an allowlist of the four payload types: `submission.created`,
        `score.created`, `vote.created`, `results.published`. An empty or omitted
        list receives ALL event types.

        Deliveries are attempted synchronously inside the triggering request
        with a 3 s timeout and never fail or slow that request materially; a
        failing subscriber is recorded as data. Failed/pending deliveries are
        retried in place (same row, attempts increments, capped at
        --max-attempts) by the visible batch command:
        `manage.py flush_webhooks [--max-attempts N]`.
      security:
      - cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_slug:
                  type: string
                url:
                  type: string
                events:
                  type: array
                  description: Allowlist of payload types to receive; an empty
                    or omitted list receives ALL event types.
                  items:
                    type: string
                    enum:
                    - submission.created
                    - score.created
                    - vote.created
                    - results.published
      responses:
        '201':
          description: Webhook created (secret returned ONCE)
        '429':
          description: Rate limited
        '415':
          description: "Unsupported media type \u2014 request body must be JSON"
        '401':
          description: Unauthenticated
  /api/webhooks/{webhook_id}/deliveries:
    get:
      summary: List webhook deliveries (organizer only)
      description: |
        The organizer's delivery log — the answer to "did my webhook fire?".
        Returns the subscription summary plus its most recent delivery rows
        (up to 200), each $ref'ing WebhookDelivery. Only the organizer of the
        webhook's event (or an admin) may read it; non-organizers and unknown
        webhook ids both get 403 so the endpoint does not leak which ids exist.
      security:
      - cookie: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook subscription with its delivery log
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      url:
                        type: string
                      events:
                        type: array
                        description: Payload-type allowlist; empty means all.
                        items:
                          type: string
                      is_active:
                        type: boolean
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (caller does not organize this webhook's event, or the id is unknown)
        '404':
          description: Unknown webhook id
        '429':
          description: Rate limited
