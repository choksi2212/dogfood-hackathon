participant_HEADER  = "Cookie: session=YUw_DjXjHnPoQWQMN0G3r1vfgHP7gVV7Y0G2Im6-8Ks"

# Tiers we claim. Honesty over breadth.
[tiers]
claimed = ["t1", "t2"]
