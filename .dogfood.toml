# .dogfood.toml — DOGFOOD 2026 acceptance config
#
# The acceptance suite reads this file. It declares:
#   [meta]      team name + the demo event slug + the known fixture title
#               the suite expects to find in the gallery
#   [server]    base URL of the running portal
#   [routes]    five route names the suite will hit
#   [auth]      four pre-baked session cookies (printed by seed_fixtures)
#   [tiers]     which tier checks to run (T1 checks run unconditionally;
#               T2/T3/T4 checks run when their tier is claimed)

[meta]
team = "Manas & Mihir"
event_slug = "sample-hack-2026"
known_fixture_title = "Quokka — a tiny, friendly submission platform."

[server]
base_url = "http://localhost:8000"

[routes]
gallery       = "/api/gallery"
submit        = "/api/events/sample-hack-2026/submit"
judge_scores  = "/api/judge/scores"
peer_scores   = "/api/judge/peer-scores"
csv_export    = "/api/csv_export"

# Pre-baked session cookies. Regenerated by:
#   docker compose exec web python manage.py seed_fixtures
[auth]
organizer_HEADER    = "Cookie: session=fOY-oh068okOSgFPxpppzpb47zA0QzugbWM3b1D3kbg"
judge_a_HEADER      = "Cookie: session=i0iznCbU86yDVpFMhuxuIZwnNVl-ytddIfRX4S0-bFI"
judge_b_HEADER      = "Cookie: session=QKvumMYb_3WOjDxgbsiUDcSAEDT_XoU_wDyMHbY0yR0"
participant_HEADER  = "Cookie: session=WtxrywVRQPIUotigo6japoQytZ9b2EP0xNTredjPb5Q"

# Tiers we claim. Honesty over breadth.
[tiers]
claimed = ["t1"]
