# .dogfood.toml — DOGFOOD 2026 acceptance config
#
# The acceptance suite reads this file. It declares:
#   [meta]      team name + the demo event slug + the known fixture title
#               the suite expects to find in the gallery
#   [server]    base URL of the running portal
#   [routes]    five route names the suite will hit
#   [auth]      four pre-baked session cookies (printed by seed_fixtures)
#   [tiers]     which tier checks to run (T1 checks run unconditionally;
#               T2/T3/T4 checks run when their tier is claimed)

[meta]
team = "Manas & Mihir"
event_slug = "sample-hack-2026"
known_fixture_title = "Quokka — a tiny, friendly submission platform."

[server]
base_url = "http://localhost:8000"

[routes]
gallery       = "/api/gallery"
submit        = "/api/events/sample-hack-2026/submit"
judge_scores  = "/api/judge/scores"
peer_scores   = "/api/judge/peer-scores"
csv_export    = "/api/csv_export"

# Pre-baked session cookies. Regenerated by:
#   docker compose exec web python manage.py seed_fixtures
[auth]
organizer_HEADER    = "Cookie: session=yDiQsH5dGKiJO3k87ud2Ym_AqJBlYpklyIQywjN9mdg"
judge_a_HEADER      = "Cookie: session=-GIn-YeggTnB4cnN_rOK8EmurcN0CFSHtXXkyTZuKe8"
judge_b_HEADER      = "Cookie: session=3pEIqpIREdAAFuIHkcnWrBrq9F2hK2ARk6JLTnGdPFE"
judge_c_HEADER      = "Cookie: session=UsIPvCy0Y94cMekzHLfogQtA6trT27enIxt0vEl5m5Q"
participant_HEADER  = "Cookie: session=zd8Xt3K6up2GDnvJDUIb5NIue7yYuTFe-QdoiExnwyw"

# Tiers we claim. Honesty over breadth.
# Tiers we claim. Honesty over breadth.
[tiers]
claimed = ["t1", "t2", "t3"]

# Bonus challenges we have built and tested. Each bonus name maps to
# the deliverable file + the test that defends it.
#
#   normalization_proof — apps/normalization/proof.py + tests/normalization/
#                         including the rank-movement proof on unbalanced
#                         bipartite graphs. Demo proof at repo root:
#                         normalization-proof.txt
#   pairwise_mode       — apps/pairwise/fit.py (Bradley-Terry MM with
#                         phantom prior) + tests/pairwise/
#   threat_model        — THREAT-MODEL.md at repo root. Covers all five
#                         primary attacks named in the spec (sybil votes,
#                         ballot stuffing, scraping, collusion, deadline
#                         gaming). Defenses verified by tests/security/.
#   api_first           — openapi.yaml at repo root + /api/schema/.
#                         Every UI action is in the spec (see tests/
#                         conformance/test_openapi.py::test_no_undocumented_
#                         paths_in_urlconf). New endpoints (e.g. T3
#                         comments) added with documented schemas.
[bonuses]
claimed = ["normalization_proof", "pairwise_mode", "threat_model", "api_first"]
