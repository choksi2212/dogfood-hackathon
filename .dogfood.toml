# .dogfood.toml — DOGFOOD 2026 acceptance config
#
# Schema matches the official run.py exactly:
#   [portal]   base_url of the running portal
#   [tiers]    claimed = ["T1", "T2", ...] — checker reads these keys
#              verbatim (uppercase), and a tier only counts as verified
#              if every tier below it also passed.
#   [auth]     five pre-baked session cookies, one per role, printed by
#              `manage.py import_fixtures`. These are DETERMINISTIC:
#              derived (HMAC-SHA256) from DJANGO_SECRET_KEY + the role
#              label + the seeded user's email, so they are identical on
#              every boot and every fresh database. The committed values
#              work after a clean `docker compose up` — no copy-paste
#              step. They only change if you change DJANGO_SECRET_KEY.
#   [routes]   the five route names run.py hits.
#
# If you did change the secret, regenerate with:
#   docker compose exec portal python manage.py import_fixtures

[portal]
base_url = "http://localhost:8000"

[tiers]
claimed = ["T1", "T2", "T3", "T4"]
pitch = "A self-hosted hackathon portal with a judging engine you can trust: backend role isolation, weighted rubrics, z-score + additive-shift normalization with a proof, Bradley-Terry pairwise mode, signed certificates and publicly verifiable judge records, and byte-identical bulk import/export in a one-command seeded deploy."

[auth]
organizer   = "Cookie: session=7c88319d28dd1b35e913b7ccab7e3abea4187955af8a546d87f6676bd1b0a7de"
judge_a     = "Cookie: session=bea4915be9f755e231e596af9e8ee6e196a01648f830c1548ae61e3fc690f8ad"
judge_b     = "Cookie: session=fee3c6d81182a6b8fa515f0de5153a6f8dcb1604a57a03a5494fff3d9b90d6f9"
judge_c     = "Cookie: session=62f4bfb840cb085dc3cfab8f46ea18c65d19cf92db5b59591ba44296206946b8"
participant = "Cookie: session=311f8536834f967a7a34350bfb83f018aeba2afe2bb9661e79670e30a72d6726"

[routes]
gallery      = "/api/gallery"
submit       = "/api/events/sample-hack-2026/submit"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/peer-scores?judge=judge_a"
csv_export   = "/api/csv_export"

# Bonus challenges we have built and tested. Each bonus name maps to
# the deliverable file + the test that defends it.
#
#   normalization_proof — apps/normalization/proof.py + tests/normalization/
#                         including the rank-movement proof on unbalanced
#                         bipartite graphs. Demo proof at repo root:
#                         normalization-proof.txt
#   pairwise_mode       — apps/pairwise/fit.py (Bradley-Terry MM with
#                         phantom prior) + tests/pairwise/
#   threat_model        — THREAT-MODEL.md at repo root. Covers all five
#                         primary attacks named in the spec (sybil votes,
#                         ballot stuffing, scraping, collusion, deadline
#                         gaming). Defenses verified by tests/security/.
#   api_first           — openapi.yaml at repo root + /api/schema/.
#                         Every UI action is in the spec (see tests/
#                         conformance/test_openapi.py::test_no_undocumented_
#                         paths_in_urlconf). New endpoints (e.g. T3
#                         comments) added with documented schemas.
[bonuses]
claimed = ["normalization_proof", "pairwise_mode", "api_first"]
