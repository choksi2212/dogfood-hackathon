[mypy]
# Type-check the local apps only. Vendored code (django, drf) is
# checked via stubs.
files = apps/

python_version = 3.12
plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

# Ignore migrations (autogenerated boilerplate) and the test files
# (we test at runtime, not at type-check time).
exclude = (?x)(^apps/[^/]+/migrations/.* | ^apps/[^/]+/tests.py | ^tests/)

# Pragmatic defaults — strict mode would break too much legacy code
# in one pass. These flags catch the most useful classes of bug
# without blocking the build.
warn_unused_ignores = True
warn_return_any = False
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
no_implicit_optional = False

# Models — we DON'T require explicit annotations on every field.
# The django-stubs plugin should infer Field[X] types from the
# assignment; if it fails on a specific model, fix that model
# rather than disabling the rule globally.
[mypy-apps.*.migrations.*]
ignore_errors = True

[mypy-apps.*.tests.*]
ignore_errors = True

# Django-stubs can't always infer the type of model fields declared
# with `models.XField(...)` — it emits "Need type annotation" noise
# even when the field is obviously typed by the assignment. We
# tolerate that in models (the runtime types are unambiguous) but
# keep the strict rules on views / decorators / urls.
[mypy-apps.*.models]
disallow_untyped_defs = False
disable_error_code = var-annotated

# The legacy code (pre-2026-09-26) wasn't typed; we don't break
# the build for it. Each new module added afterwards is expected
# to be typed (see the explicit per-module overrides below).
[mypy-apps.observability.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-apps.billing.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
