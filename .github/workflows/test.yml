name: test

on:
  pull_request:
    branches: [main, manas]
  push:
    branches: [main, manas]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dogfood
          POSTGRES_USER: dogfood
          POSTGRES_PASSWORD: dogfood
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogfood -d dogfood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      # Settings.py reads POSTGRES_* env vars; DATABASE_URL is kept
      # alongside them as the spec asks, and the POSTGRES_HOST is what
      # actually drives the Django DB connection.
      DATABASE_URL: postgres://dogfood:dogfood@localhost:5432/dogfood
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: test-secret-not-for-prod
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      # Don't try to bind a real port — pytest-django uses the test client.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U dogfood -d dogfood; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"
          exit 1

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run pytest (JUnit XML)
        run: pytest tests/ -v --tb=short --junitxml=report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: pytest-report
          path: report.xml
          retention-days: 14
          if-no-files-found: warn
