name: acceptance

# Runs the seven-check acceptance suite after `test` has succeeded on
# main / manas. Re-seeds fixtures on every run so the session tokens
# captured in .dogfood.toml are fresh for the live server in this job.
#
# If the run was triggered by a pull_request (workflow_run event), the
# acceptance summary is posted as a PR comment.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main, manas]

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  accept:
    # Only run if the test workflow on the same head SHA succeeded.
    if: >-
      github.event.workflow_run.conclusion == 'success'
    name: 7-check acceptance
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dogfood
          POSTGRES_USER: dogfood
          POSTGRES_PASSWORD: dogfood
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogfood -d dogfood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      DATABASE_URL: postgres://dogfood:dogfood@localhost:5432/dogfood
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: test-secret-not-for-prod
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U dogfood -d dogfood; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"
          exit 1

      - name: Apply migrations
        run: python manage.py migrate --noinput

      # seed_fixtures prints a HEADER block to stdout. Capture it and
      # rebuild .dogfood.ci.toml with the fresh session tokens so the
      # acceptance suite can authenticate as the pre-baked users.
      - name: Run seed_fixtures
        id: seed
        run: |
          python manage.py seed_fixtures > seed.out 2>&1 || (cat seed.out && exit 1)

      - name: Rebuild .dogfood.toml with fresh tokens
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, pathlib, sys

          seed_out = pathlib.Path("seed.out").read_text(encoding="utf-8", errors="replace")

          # Pull out every "LABEL_HEADER = \"Cookie: session=TOKEN\""
          # line that seed_fixtures prints.
          token_re = re.compile(
              r'^([A-Z_]+)_HEADER\s*=\s*"Cookie:\s*session=([^"]+)"\s*$',
              re.MULTILINE,
          )
          tokens = dict(token_re.findall(seed_out))
          required = ["ORGANIZER", "JUDGE_A", "JUDGE_B", "JUDGE_C", "PARTICIPANT"]
          missing = [k for k in required if k not in tokens]
          if missing:
              print(f"seed_fixtures output is missing tokens for: {missing}", file=sys.stderr)
              print("--- seed.out ---", file=sys.stderr)
              print(seed_out, file=sys.stderr)
              sys.exit(1)

          original = pathlib.Path(".dogfood.toml").read_text(encoding="utf-8")
          out = original
          for label_upper, token in tokens.items():
              label = label_upper.replace("_HEADER", "").lower()
              # Replace whatever value is currently bound to that label.
              pattern = re.compile(
                  rf'({re.escape(label.upper())}_HEADER\s*=\s*")[^"]*(")',
                  re.MULTILINE,
              )
              new_line, n = pattern.subn(rf'\g<1>Cookie: session={token}\g<2>', out)
              if n == 0:
                  print(f"WARNING: did not find {label.upper()}_HEADER in .dogfood.toml", file=sys.stderr)
              out = new_line

          pathlib.Path(".dogfood.ci.toml").write_text(out, encoding="utf-8")
          print("wrote .dogfood.ci.toml with fresh tokens")
          PY

      - name: Start Django dev server
        run: |
          # Bind to 127.0.0.1 so the runner cannot reach it from outside.
          # `manage.py runserver` creates the DB schema on first request
          # if needed, so we don't need a separate "warm" call.
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          echo "server_pid=$!"
          # Wait until /healthz returns 200.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || echo 000)
            if [ "$code" = "200" ]; then
              echo "server up (200) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became ready"
          cat server.log
          exit 1

      - name: Run acceptance suite
        id: accept
        run: |
          set -o pipefail
          make accept-ci | tee acceptance-report.txt
        env:
          # Make sure the just-built .dogfood.ci.toml (with fresh
          # session tokens from this job's seed_fixtures run) is the
          # one acceptance.py reads. .dogfood.toml ships with stale
          # tokens in the repo so it would fail the auth-bearing
          # checks (T2.04 .. T2.07).
          DOGFOOD_CONFIG: .dogfood.ci.toml

      - name: Stop Django dev server
        if: always()
        run: |
          pkill -f "manage.py runserver" || true

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: acceptance-report
          path: acceptance-report.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPT_OUTCOME: ${{ steps.accept.outcome }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # workflow_run stores pull_requests as an array of {number, head_sha}.
          PR_JSON=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/pull_requests")
          PR_NUMBER=$(echo "${PR_JSON}" | python -c 'import json,sys; data=json.load(sys.stdin); print(data[0]["number"] if data else "")')
          if [ -z "${PR_NUMBER}" ]; then
            echo "no associated PR for workflow run ${WORKFLOW_RUN_ID}; nothing to comment"
            exit 0
          fi

          {
            echo "## Acceptance — \`${ACCEPT_OUTCOME}\`"
            echo
            echo "<details><summary>acceptance-report.txt</summary>"
            echo
            echo '```'
            cat acceptance-report.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
          } > /tmp/comment.md

          gh pr comment "${PR_NUMBER}" --body-file /tmp/comment.md
