[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -ra -q --tb=short --strict-markers
markers =
    smoke:        boot + health + key endpoints
    auth:         session lifecycle
    roles:        role × endpoint matrix
    deadlines:    deadline boundary conditions
    voting:       T3 voting + quadratic budget + retraction
    pairwise:     Bradley-Terry synthetic + convergence
    normalization: additive fit + edge cases
    assignment:   disjoint bipartite + COI
    csv:          CSV export shape + edge cases
    certificates: HMAC sign/verify + tamper detection
    widget:       embeddable JS + CORS + JSON feed
    schema:       migrations present + model integrity
    conformance:  endpoints match openapi.yaml
    concurrency:  race conditions on save endpoints
    golden:       known-good outputs for the fixture dataset
