; supervisord.conf — process manager for the all-in-one container.
;
; Four programs, one process tree. Postgres is bootstrapped by
; entrypoint-all-in-one.sh (needs to be running before migrations /
; seeding can happen) and is kept alive here so it survives.
;
;   postgres  — local Postgres on 5432 (only this container connects)
;   django    — manage.py runserver (binds to 127.0.0.1:8001)
;   next      — next start -p 3000 (the built frontend, in /app/web)
;   nginx     — public entry on :8000, proxies /api → django, / → next
;
; Docker maps host :8000 → container :8000, so nginx has to bind :8000
; itself. Django and next only need to be reachable on the loopback
; interface (nginx is the only client).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:django]
command=python manage.py runserver 127.0.0.1:8001 --noreload
directory=/app
environment=POSTGRES_HOST="127.0.0.1",POSTGRES_PORT="5432",DJANGO_DEBUG="true",DJANGO_ALLOWED_HOSTS="*",DJANGO_SECRET_KEY="dev-secret-key-change-in-production"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:next]
command=npx next start -p 3000 -H 127.0.0.1
directory=/app/web
environment=NODE_ENV=production,NEXT_PUBLIC_API_BASE="/api",API_INTERNAL_URL=http://127.0.0.1:8001
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
