# nginx config for the all-in-one container.
#
# Public :8000 — exposed on host :8000 by docker-compose.
# Proxies /api → django (127.0.0.1:8001), everything else → next (127.0.0.1:3000).
# /healthz is answered by django; /widget.js etc. are answered by django too.

upstream django_backend {
    server 127.0.0.1:8001;
}

upstream next_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 8000 default_server;
    server_name _;
    client_max_body_size 25m;

    location /healthz {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /widget.js {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
